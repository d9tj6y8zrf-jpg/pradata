name: Actualització diària de PRADATA


on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: "pradata-pages"
  cancel-in-progress: false


jobs:
  actualitza:
    name: Consulta les fonts i prepara la web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recupera el projecte
        uses: actions/checkout@v6


      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Consulta les fonts públiques
        run: python scripts/collect.py


      - name: Comprova el motor
        run: python -m unittest discover -s tests -v
