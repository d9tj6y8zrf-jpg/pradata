name: Actualització diària de PRADATA

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pradata-pages"
  cancel-in-progress: false

jobs:
  actualitza:
    name: Consulta les fonts i prepara la web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recupera el projecte
        uses: actions/checkout@v6

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Consulta les fonts públiques
        run: python scripts/collect.py

      - name: Comprova el motor
        run: python -m unittest discover -s tests -v

      - name: Comprova la sortida estàtica
        run: python scripts/check_output.py

      - name: Guarda l'historial al repositori
        shell: bash
        run: |
          git config user.name "PRADATA automàtic"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No hi ha canvis per guardar."
          else
            git commit -m "Actualització diària de PRADATA"
            git push
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara els fitxers per a Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publica:
    name: Publica a GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: actualitza
    steps:
      - name: Publica la web
        id: deployment
        uses: actions/deploy-pages@v4
