name: Substitueix les actes de Telegram per publicacions amb foto

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/substitueix-actes-telegram.yml"

permissions:
  contents: read

jobs:
  substitueix:
    name: Envia les fotos i retira els avisos sense imatge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Substitueix els dos avisos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/replace_act_notifications.py
